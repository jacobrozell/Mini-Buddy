name: MiniBuddy
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
options:
  bundleIdPrefix: com.jacobrozell
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7JT2JB89AV"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "13"

configs:
  Debug: debug
  Release: release

targets:
  MiniBuddy:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.jacobrozell.tabletome
            CFBundleURLSchemes:
              - minibuddy
        NSBonjourServices:
          - _minibuddy-match._tcp
          - _minibuddy-match._udp
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: CrestLogo
          UIImageRespectsSafeAreaInsets: true
    sources:
      - path: App
      - path: Features
        excludes:
          - "**/README.md"
      - path: DesignSystem
        excludes:
          - "**/README.md"
      - path: Support
        excludes:
          - "**/README.md"
      - path: Resources/Rules
        buildPhase: resources
        type: folder
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Catalogs
        buildPhase: resources
        type: folder
      - path: Resources/GoogleService-Info.plist
        type: file
        buildPhase: resources
    dependencies:
      - target: MiniBuddyDomain
      - target: MiniBuddyData
      - target: MiniBuddyHobbyData
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    postBuildScripts:
      - name: Firebase Crashlytics
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            exit 0
          fi
          if ! [ -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" ]; then
            exit 0
          fi
          if grep -q "REPLACE_WITH" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" 2>/dev/null; then
            exit 0
          fi
          RUN_SCRIPT="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ ! -f "$RUN_SCRIPT" ]; then
            echo "warning: Crashlytics run script not found at $RUN_SCRIPT"
            exit 0
          fi
          "$RUN_SCRIPT"
        inputFileLists:
          - Scripts/FirebaseCrashlyticsInputFiles.xcfilelist
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tabletome
        INFOPLIST_KEY_CFBundleDisplayName: Mini Buddy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Mini Buddy uses the local network to sync match state between two nearby devices."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml"
          fi
        basedOnDependencyAnalysis: false

  MiniBuddyDomain:
    type: framework
    platform: iOS
    sources:
      - path: Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tabletome.domain
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  MiniBuddyData:
    type: framework
    platform: iOS
    sources:
      - path: Data
        excludes:
          - "Hobby/**"
    dependencies:
      - target: MiniBuddyDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tabletome.data
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  MiniBuddyHobbyData:
    type: framework
    platform: iOS
    sources:
      - path: Data/Hobby
    dependencies:
      - target: MiniBuddyDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tabletome.hobbydata
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  MiniBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
        excludes:
          - "**/Fixtures/**"
      - path: Tests/Unit/Fixtures
        buildPhase: resources
      - path: Resources/Rules
        buildPhase: resources
        type: folder
    dependencies:
      - target: MiniBuddy
      - target: MiniBuddyDomain
      - target: MiniBuddyData
      - target: MiniBuddyHobbyData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tabletome.tests
        GENERATE_INFOPLIST_FILE: YES

  MiniBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: MiniBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tabletome.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiniBuddy

schemes:
  MiniBuddy:
    build:
      targets:
        MiniBuddy: all
        MiniBuddyTests: [test]
        MiniBuddyUITests: [test]
    test:
      targets:
        - MiniBuddyTests
        - MiniBuddyUITests
    run:
      config: Debug

  MiniBuddyCI:
    build:
      targets:
        MiniBuddy: all
        MiniBuddyTests: [test]
        MiniBuddyUITests: [test]
    test:
      targets:
        - MiniBuddyTests
        - MiniBuddyUITests
    run:
      config: Debug
